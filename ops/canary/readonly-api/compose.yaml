name: traders-readonly-api-canary

services:
  readonly-api-canary:
    profiles: ["readonly-api-canary"]
    image: traders-readonly-api:880264b1-canary-preparation
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: readonly-api
      labels:
        org.opencontainers.image.revision: 880264b1d0a881c01f8fe67dc151c0b69dd4c649
        org.opencontainers.image.source: traders-ml
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    init: true
    cpus: "0.50"
    mem_limit: 256m
    pids_limit: 64
    deploy:
      replicas: 1
    ports:
      - "127.0.0.1:${TRADERS_READONLY_API_CANARY_PORT:-18080}:8080"
    environment:
      TRADERS_READONLY_API_DATABASE_URL: "${TRADERS_READONLY_API_DATABASE_URL:-}"
      TRADERS_READONLY_API_HOST: "0.0.0.0"
      TRADERS_READONLY_API_PORT: "8080"
      TRADERS_READONLY_API_LOG_LEVEL: "${TRADERS_READONLY_API_LOG_LEVEL:-info}"
      TRADERS_READONLY_API_STATEMENT_TIMEOUT_MS: "${TRADERS_READONLY_API_STATEMENT_TIMEOUT_MS:-30000}"
      TRADERS_READONLY_API_POOL_SIZE: "${TRADERS_READONLY_API_POOL_SIZE:-5}"
      TRADERS_READONLY_API_POOL_TIMEOUT_SECONDS: "${TRADERS_READONLY_API_POOL_TIMEOUT_SECONDS:-30}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - canary

networks:
  canary:
    name: "${TRADERS_READONLY_API_CANARY_NETWORK:-traders-readonly-api-canary}"
    external: true
