[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traders-ml"
version = "0.2.0"
description = "Modular trading engine platform with PostgreSQL-backed orchestration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "colorama==0.4.6; platform_system == 'Windows'",
    "fastapi==0.116.1",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "tzdata==2026.3; sys_platform == 'win32'",
    "uvicorn==0.51.0",
]

[project.scripts]
traders-readonly-api = "app.server_api.runtime:main"
traders-paper-production-prepare = "app.engine_paper.production_preparation_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a migrated PostgreSQL test database",
    "integration: opt-in integration test",
    "requires_postgres: requires an available PostgreSQL database",
    "requires_network: requires public network access",
]
