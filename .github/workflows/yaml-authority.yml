name: YAML authority guard
on: [push, pull_request]
jobs:
  yaml-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - run: python scripts/check_yaml_authority.py
      - run: pytest -q tests/test_yaml_authority.py
