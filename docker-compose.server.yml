services:
  postgres:
    image: postgres:16
    container_name: traders_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traders
      POSTGRES_USER: traders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - traders_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traders -d traders"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  traders_postgres_data:
