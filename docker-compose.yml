services:
  postgres:
    image: postgres:16-alpine
    restart: always
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - wal_level=replica
      - -c
      - archive_timeout=900
      - -c
      - "archive_command=if [ -f /var/lib/postgresql/wal_export/%f ]; then cmp -s %p /var/lib/postgresql/wal_export/%f; else mkdir -p /var/lib/postgresql/wal_export && cp %p /var/lib/postgresql/wal_export/%f; fi || exit 1; i=0; while [ $$i -lt 300 ] && [ ! -f /var/lib/postgresql/wal_export/%f.ack ]; do sleep 1; i=$$((i+1)); done; test -f /var/lib/postgresql/wal_export/%f.ack"
    environment:
      POSTGRES_DB: traders_ml
      POSTGRES_USER: traders_ml
      POSTGRES_PASSWORD_FILE: /run/secrets/traders_shared_db_password
    secrets:
      - traders_shared_db_password
    ports:
      - "5433:5432"
    volumes:
      - traders_ml_postgres_data:/var/lib/postgresql/data
      - D:/traders_ml_recovery/postgres:/var/lib/postgresql/recovery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traders_ml -d traders_ml"]
      interval: 10s
      timeout: 5s
      retries: 10

  market-data-sync:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c 'export DATABASE_URL="postgresql+psycopg://traders_ml:$$(cat /run/secrets/traders_shared_db_password)@postgres:5432/traders_ml";
      exec python scripts/engine_market_data_continuous_sync.py
      --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,LINKUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,SUIUSDT
      --timeframes 1m,5m,15m,1h,4h,1d
      --warmup --continuous
      --health-report reports/engine_market_data/continuous_sync/latest_health.json
      --health-report-interval-seconds 60'
    secrets:
      - traders_shared_db_password
    volumes:
      - ./reports:/service/reports

  online-orchestrator:
    build: .
    profiles: ["disabled-trade-15m"]
    # Historical/read-only compatibility only.  The legacy 15m producer must
    # never be revived by Docker after an explicit stop or host restart.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      market-data-sync:
        condition: service_started
    command: >
      sh -c 'export DATABASE_URL="postgresql+psycopg://traders_ml:$$(cat /run/secrets/traders_shared_db_password)@postgres:5432/traders_ml";
      exec python scripts/engine_orchestrator_online_pipeline.py
      --trade-profile trade-15m-v1
      --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,LINKUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,SUIUSDT
      --primary-timeframe 15m
      --required-timeframes 1m,5m,15m,1h,4h,1d
      --continuous
      --health-report reports/engine_orchestrator/latest_health.json
      --health-report-interval-seconds 60'
    volumes:
      - ./reports:/service/reports
    secrets:
      - traders_shared_db_password

  online-orchestrator-5m:
    build:
      context: .
      args:
        TRADERS_RUNTIME_SOURCE_IDENTITY: ${TRADERS_SCALPING_V2_SOURCE_IDENTITY:-UNSET}
    profiles: ["orchestrator-5m"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      market-data-sync:
        condition: service_started
    command: >
      sh -c 'export DATABASE_URL="postgresql+psycopg://traders_ml:$$(cat /run/secrets/traders_shared_db_password)@postgres:5432/traders_ml";
      exec python scripts/engine_orchestrator_online_pipeline.py
      --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,LINKUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,SUIUSDT
      --trade-profile trade-5m-v2
      --strategy-cap-shadow-economic-capture
      --continuous
      --health-report reports/engine_orchestrator/latest_health_trade_5m.json'
    environment:
      TRADERS_BINANCE_ACCOUNT_CREDENTIALS_PATH: /run/secrets/binance_account_credentials
      TRADERS_BINANCE_COMMISSION_SNAPSHOT_PATH: /run/traders-commission/binance-account-commission.json
    volumes:
      - ./reports:/service/reports
      - D:/disk_E/game_projects/traders/production_control/commission:/run/traders-commission
    secrets:
      - traders_shared_db_password
      - binance_account_credentials

  scalping-calibration-collector:
    build:
      context: .
      args:
        TRADERS_RUNTIME_SOURCE_IDENTITY: ${TRADERS_SCALPING_V2_SOURCE_IDENTITY:-UNSET}
    profiles: ["calibration"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c 'export DATABASE_URL="postgresql://traders_ml:$$(cat /run/secrets/traders_shared_db_password)@postgres:5432/traders_ml";
      exec python scripts/scalping_prospective_collector.py
      --output-dir reports/calibration/scalping-v2-probability-set2
      --symbols BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,LINKUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,SUIUSDT
      --parameter-set-id scalping-v2-set-2
      --runtime-source-commit ${TRADERS_SCALPING_V2_SOURCE_IDENTITY:-UNSET}
      --runtime-artifact-id ${TRADERS_SCALPING_V2_ARTIFACT_ID:-UNSET}
      --schema-revision 0031_scalping_parameter_sets'
    volumes:
      - ./reports:/service/reports
    secrets:
      - traders_shared_db_password

volumes:
  traders_ml_postgres_data:

secrets:
  traders_shared_db_password:
    file: ./.secrets.production.local/shared-db-password
  binance_account_credentials:
    file: ${TRADERS_BINANCE_ACCOUNT_CREDENTIALS_HOST_PATH:-C:/Users/ZENOL/Documents/BINANCE_ACCOUNT_KEY.txt}
