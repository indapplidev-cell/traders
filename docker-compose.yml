services:
  postgres:
    image: postgres:16-alpine
    restart: always
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - wal_level=replica
      - -c
      - archive_timeout=900
      - -c
      - "archive_command=if [ -f /var/lib/postgresql/wal_export/%f ]; then cmp -s %p /var/lib/postgresql/wal_export/%f; else mkdir -p /var/lib/postgresql/wal_export && cp %p /var/lib/postgresql/wal_export/%f; fi || exit 1; i=0; while [ $$i -lt 300 ] && [ ! -f /var/lib/postgresql/wal_export/%f.ack ]; do sleep 1; i=$$((i+1)); done; test -f /var/lib/postgresql/wal_export/%f.ack"
    environment:
      POSTGRES_DB: traders_ml
      POSTGRES_USER: traders_ml
      POSTGRES_PASSWORD: ${TRADERS_ML_POSTGRES_PASSWORD:?required}
    ports:
      - "5433:5432"
    volumes:
      - traders_ml_postgres_data:/var/lib/postgresql/data
      - D:/traders_ml_recovery/postgres:/var/lib/postgresql/recovery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traders_ml -d traders_ml"]
      interval: 10s
      timeout: 5s
      retries: 10

  market-data-sync:
    build: .
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      python scripts/engine_market_data_continuous_sync.py
      --symbols BTCUSDT,ETHUSDT,SOLUSDT
      --timeframes 1m,5m,15m,1h,4h,1d
      --warmup --continuous
      --health-report reports/engine_market_data/continuous_sync/latest_health.json
      --health-report-interval-seconds 60
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided by runtime secret injection}
    volumes:
      - ./reports:/service/reports

  online-orchestrator:
    build: .
    profiles: ["orchestrator"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      market-data-sync:
        condition: service_started
    command: >
      python scripts/engine_orchestrator_online_pipeline.py
      --symbols BTCUSDT,ETHUSDT,SOLUSDT
      --primary-timeframe 15m
      --required-timeframes 1m,5m,15m,1h,4h,1d
      --continuous
      --poll-interval-seconds 10
      --max-catchup-windows 4
      --health-report reports/engine_orchestrator/latest_health.json
      --health-report-interval-seconds 60
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided by runtime secret injection}
      ORCHESTRATOR_FRESHNESS_RETRY_INTERVAL_SECONDS: ${ORCHESTRATOR_FRESHNESS_RETRY_INTERVAL_SECONDS:-5}
      ORCHESTRATOR_FRESHNESS_GRACE_SECONDS: ${ORCHESTRATOR_FRESHNESS_GRACE_SECONDS:-180}
      ORCHESTRATOR_FRESHNESS_MAX_ATTEMPTS: ${ORCHESTRATOR_FRESHNESS_MAX_ATTEMPTS:-60}
      ORCHESTRATOR_WAITING_BATCH_SIZE: ${ORCHESTRATOR_WAITING_BATCH_SIZE:-100}
    volumes:
      - ./reports:/service/reports

volumes:
  traders_ml_postgres_data:
